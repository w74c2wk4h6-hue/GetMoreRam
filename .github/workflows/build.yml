yaml<br>name: Build iOS IPA<br>on: [workflow_dispatch]<br>jobs:<br>  build:<br>    runs-on: macos-latest<br>    steps:<br>      - uses: actions/checkout@v3<br>      - uses: subosito/flutter-action@v2<br>      - run: flutter pub get<br>      - run: flutter build ios --release --no-codesign<br>      - run: mkdir Payload && mv build/ios/iphoneos/Runner.app Payload/<br>      - run: zip -qq -r -9 App.ipa Payload/<br>      - uses: actions/upload-artifact@v3<br>        with:<br>          name: ios-ipa<br>          path: App.ipa<br>
